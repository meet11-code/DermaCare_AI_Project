<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - DermaCare AI</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/login.css') }}">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<div class="login-container">

<h1>🔐 Login</h1>

<form method="POST">

    <input
        type="hidden"
        name="login_type"
        value="{{ login_type }}"
    >

    <!-- Email -->
    <input
        type="email"
        name="email"
        placeholder="Enter your email"
        required
    >

    <!-- Password -->
    <input
        type="password"
        name="password"
        placeholder="Enter your password"
        required
    >

    <button
        type="submit"
        class="login-btn"
    >
        Login
    </button>

</form>

<div class="register-link">

Don't have an account?

<a href="/register">

Register

</a>

</div>

</div>

</body>

</html>
